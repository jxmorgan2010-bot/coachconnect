# Runs the app's scheduled jobs every 30 minutes: card holds 2 days before each session,
# auto-release 48 hours after, and reminders (src/lib/jobs). Vercel Hobby cron only runs once a
# day, so the schedule lives here instead.
#
# Cost: all three jobs are one Actions job, and GitHub bills each job rounded up to a whole minute.
# Every 30 minutes is at most 31 x 48 = 1,488 billed minutes a month on ubuntu-latest ($0.006/min,
# about $8.93), inside GitHub Free's $12 monthly allowance for private repositories (~2,000
# minutes). Every 15 minutes (2,976) would not fit. Public repositories aren't billed at all.
#
# Needs one repository secret, CRON_SECRET (Settings -> Secrets and variables -> Actions), with the
# same value as CRON_SECRET in Vercel's Production environment. Without it every run skips.
#
# GitHub may start scheduled runs late or skip one when it's busy, and every job catches up on
# anything it missed, so that only delays work. The minutes avoid the busy top of the hour. The
# 1-hour reminder window (src/lib/reminders.ts) always holds at least two runs at this spacing.
name: Scheduled jobs

on:
  schedule:
    - cron: "7,37 * * * *"
  workflow_dispatch:

permissions: {}

concurrency:
  group: scheduled-jobs
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    # Keeps a stuck run from costing more than a few minutes.
    timeout-minutes: 4
    steps:
      - name: Run card holds, auto-release and reminders
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          SITE: https://getassistcoaching.com
        run: |
          if [ -z "$CRON_SECRET" ]; then
            echo "CRON_SECRET isn't set for this repository, so nothing runs. Add it to start the scheduler."
            exit 0
          fi
          failed=0
          body=$(mktemp)
          for job in card-holds auto-release reminders; do
            echo "== $job"
            : > "$body"
            # Responses carry counts only. A failing job doesn't stop the others. Redirects aren't
            # followed, because curl would drop the Authorization header on a change of host, and
            # anything but a 200 counts as a failure, so a redirect can't pass as a successful run.
            status=$(curl --silent --show-error --max-time 60 -X POST -o "$body" -w '%{http_code}' \
                     -H "Authorization: Bearer $CRON_SECRET" "$SITE/api/jobs/$job") || status=000
            cat "$body"
            echo
            case "$status" in
              200) ;;
              401)
                echo "::error title=$job refused (401)::$SITE refused CRON_SECRET, so $job did not run. Check that CRON_SECRET in Vercel's Production environment is set, is at least 32 characters and matches this repository's secret exactly, then redeploy: Vercel only applies a changed variable to new deployments."
                failed=1
                ;;
              3*)
                echo "::error title=$job redirected ($status)::$SITE/api/jobs/$job redirected, so $job did not run. Point SITE at the final address."
                failed=1
                ;;
              000)
                echo "::error title=$job unreachable::No response from $SITE/api/jobs/$job, so $job did not run."
                failed=1
                ;;
              *)
                echo "::error title=$job failed ($status)::$SITE/api/jobs/$job returned $status."
                failed=1
                ;;
            esac
          done
          exit $failed
