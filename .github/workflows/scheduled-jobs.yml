# Runs the app's scheduled jobs every 15 minutes: card holds 2 days before each session,
# auto-release 48 hours after, and reminders (src/lib/jobs). Vercel Hobby cron only runs once a
# day, so the schedule lives here instead.
#
# Needs one repository secret, CRON_SECRET (Settings -> Secrets and variables -> Actions), with the
# same value as CRON_SECRET in Vercel's Production environment. Without it every run skips.
#
# GitHub may start scheduled runs late or skip one when it's busy, and every job catches up on
# anything it missed, so that only delays work. The minutes avoid the busy top of the hour.
name: Scheduled jobs

on:
  schedule:
    - cron: "7,22,37,52 * * * *"
  workflow_dispatch:

permissions: {}

concurrency:
  group: scheduled-jobs
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Run card holds, auto-release and reminders
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          SITE: https://getassistcoaching.com
        run: |
          if [ -z "$CRON_SECRET" ]; then
            echo "CRON_SECRET isn't set for this repository, so nothing runs. Add it to start the scheduler."
            exit 0
          fi
          failed=0
          for job in card-holds auto-release reminders; do
            echo "== $job"
            # Responses carry counts only. A failing job doesn't stop the others.
            if ! curl --silent --show-error --fail-with-body --max-time 90 -X POST \
                 -H "Authorization: Bearer $CRON_SECRET" "$SITE/api/jobs/$job"; then
              failed=1
            fi
            echo
          done
          exit $failed
