# One-click backup for the scheduled jobs: card holds 2 days before each session, auto-release 48
# hours after, and reminders (src/lib/jobs). cron-job.org is the scheduler and calls the same
# endpoints. This has no schedule of its own, because GitHub ran it only a few times a day. To run
# it: Actions -> Scheduled jobs -> Run workflow. It runs the real jobs against production.
#
# Needs one repository secret, CRON_SECRET (Settings -> Secrets and variables -> Actions), with the
# same value as CRON_SECRET in Vercel's Production environment. Without it the run skips.
name: Scheduled jobs

on:
  workflow_dispatch:

permissions: {}

concurrency:
  group: scheduled-jobs
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    # Keeps a stuck run from costing more than a few minutes.
    timeout-minutes: 4
    steps:
      - name: Run card holds, auto-release and reminders
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          SITE: https://getassistcoaching.com
        run: |
          if [ -z "$CRON_SECRET" ]; then
            echo "CRON_SECRET isn't set for this repository, so nothing runs."
            exit 0
          fi
          failed=0
          body=$(mktemp)
          for job in card-holds auto-release reminders; do
            echo "== $job"
            : > "$body"
            # Responses carry counts only. A failing job doesn't stop the others. Redirects aren't
            # followed, because curl would drop the Authorization header on a change of host, and
            # anything but a 200 counts as a failure, so a redirect can't pass as a successful run.
            status=$(curl --silent --show-error --max-time 60 -X POST -o "$body" -w '%{http_code}' \
                     -H "Authorization: Bearer $CRON_SECRET" "$SITE/api/jobs/$job") || status=000
            cat "$body"
            echo
            case "$status" in
              200) ;;
              401)
                echo "::error title=$job refused (401)::$SITE refused CRON_SECRET, so $job did not run. Check that CRON_SECRET in Vercel's Production environment is set, is at least 32 characters and matches this repository's secret exactly, then redeploy: Vercel only applies a changed variable to new deployments."
                failed=1
                ;;
              3*)
                echo "::error title=$job redirected ($status)::$SITE/api/jobs/$job redirected, so $job did not run. Point SITE at the final address."
                failed=1
                ;;
              000)
                echo "::error title=$job unreachable::No response from $SITE/api/jobs/$job, so $job did not run."
                failed=1
                ;;
              *)
                echo "::error title=$job failed ($status)::$SITE/api/jobs/$job returned $status."
                failed=1
                ;;
            esac
          done
          exit $failed
